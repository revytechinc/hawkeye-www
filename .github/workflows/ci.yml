name: Build
on: [pull_request, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm ci
      - name: Build Angular app
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: hawkeye-www-dist
          path: dist/hawkeye-www
